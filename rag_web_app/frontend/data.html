<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAG-Eval-App — Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-data flex flex-col min-h-screen">
  <div class="bg-overlay">
    <main class="w-full flex justify-center">
      <div class="w-full md:w-4/5 max-w-7xl mx-auto px-4">
        <!-- Header -->
        <header class="w-full bg-white shadow-sm">
          <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="text-xl font-semibold">RAG-Eval-App — Ground Truth Generator</div>
            <nav class="flex space-x-2">
              <a href="index.html" class="px-4 py-2 rounded-md bg-transparent text-gray-700 hover:bg-gray-100">Back to App</a>
            </nav>
          </div>
        </header>

        <!-- Stats Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-8">
          <div class="bg-white p-4 rounded-lg shadow">
            <div class="text-sm text-gray-600">Documents</div>
            <div id="statDocs" class="text-2xl font-bold text-blue-600">0</div>
          </div>
          <div class="bg-white p-4 rounded-lg shadow">
            <div class="text-sm text-gray-600">Generated Questions</div>
            <div id="statQuestions" class="text-2xl font-bold text-green-600">0</div>
          </div>
          <div class="bg-white p-4 rounded-lg shadow">
            <div class="text-sm text-gray-600">Avg per Doc</div>
            <div id="statAvg" class="text-2xl font-bold text-purple-600">0</div>
          </div>
          <div class="bg-white p-4 rounded-lg shadow">
            <div class="text-sm text-gray-600">GT Files</div>
            <div id="statFiles" class="text-2xl font-bold text-orange-600">N/A</div>
          </div>
        </div>

        <!-- Main Content: two-column layout -->
        <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
          <!-- Left: Generator panel -->
          <section class="w-full p-6 bg-white rounded-2xl shadow-lg">
            <h1 class="text-2xl font-bold mb-6">Generate Ground Truth Data</h1>

            <!-- File Upload -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2">Select PDF Document</label>
              <input id="gtFile" type="file" accept=".pdf"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              <p class="mt-1 text-xs text-gray-500">Upload a PDF to generate ground truth Q&A pairs</p>
            </div>

            <!-- Configuration -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Number of Questions</label>
                <input id="numQuestions" type="number" min="1" max="20" value="5"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Question Type</label>
                <select id="questionType"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="mixed">Mixed</option>
                  <option value="factual">Factual</option>
                  <option value="reasoning">Reasoning</option>
                  <option value="extractive">Extractive</option>
                </select>
              </div>
            </div>

            <!-- Custom Prompt (Optional) -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2">Custom Prompt (Optional)</label>
              <textarea id="customPrompt" rows="3" placeholder="e.g., Focus on technical concepts and definitions..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-4 mb-4">
              <button id="generateBtn"
                      class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                Generate Ground Truth
              </button>
              <button id="exportBtn" disabled
                      class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                Export JSON
              </button>
            </div>

            <!-- Status Message -->
            <div id="generateStatus" class="text-sm"></div>
          </section>

          <!-- Right: Preview panel -->
          <aside class="w-full">
            <div class="sticky top-6">
              <div id="dataPreview"
                   class="bg-white rounded-2xl shadow-lg border border-gray-200 h-[70vh] overflow-y-auto">
                <div class="p-8 text-center text-gray-500">
                  <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  <p class="text-lg font-medium">No data generated yet</p>
                  <p class="text-sm mt-2">Upload a PDF and click "Generate Ground Truth" to begin</p>
                </div>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </main>
    <script src="data.js"></script>
  </div>
</body>
</html>
